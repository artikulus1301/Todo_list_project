<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }

        .app {
            max-width: 1300px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
            padding: 28px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 24px;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 24px;
        }

        .panel {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 500px;
        }

        .panel h2 {
            font-size: 1.1rem;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        input, textarea, button {
            border: none;
            outline: none;
            font-size: 0.95rem;
            border-radius: 12px;
        }

        input, textarea {
            background: #fff;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        button {
            background: #3b82f6;
            color: white;
            padding: 10px 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row input {
            flex: 1;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        li {
            background: #fff;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e9eef3;
        }

        li.done span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        li span {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }

        .mini-btn {
            background: transparent;
            color: #64748b;
            padding: 4px 8px;
            font-size: 0.85rem;
        }

        .mini-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cal-header button {
            background: transparent;
            color: #1e293b;
            padding: 4px 10px;
        }

        .cal-header button:hover {
            background: #e2e8f0;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 0.8rem;
            flex: 1;
        }

        .weekday {
            color: #64748b;
            padding: 4px 0;
            font-size: 0.7rem;
        }

        .day {
            background: #fff;
            border-radius: 8px;
            padding: 8px 0;
            cursor: pointer;
            border: 1px solid #eef2f6;
        }

        .day:hover {
            background: #eff6ff;
        }

        .day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day.today {
            background: #3b82f6;
            color: white;
        }

        .day.selected {
            outline: 2px solid #3b82f6;
        }

        .note-item {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #e9eef3;
        }

        .note-item p {
            color: #334155;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 6px;
        }

        .note-item .note-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-item .note-date {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .empty-msg {
            color: #94a3b8;
            text-align: center;
            padding: 20px 8px;
            font-style: italic;
            font-size: 0.85rem;
        }

        @media (max-width: 900px) {
            .panels { grid-template-columns: 1fr; }
            .panel { min-height: auto; }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Заметки · Календарь · ToDo</h1>
        <div class="panels">
            <div class="panel">
                <h2>ToDo</h2>
                <div class="row">
                    <input type="text" id="todoInput" placeholder="Новая задача...">
                    <button id="addTodoBtn">Добавить</button>
                </div>
                <ul id="todoList"></ul>
                <div class="empty-msg" id="todoEmpty">Нет задач</div>
            </div>

            <div class="panel">
                <h2>Календарь</h2>
                <div class="cal-header">
                    <button id="prevMonthBtn">Назад</button>
                    <span id="monthYear"></span>
                    <button id="nextMonthBtn">Вперёд</button>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div style="text-align:center; font-size:0.8rem; color:#64748b;">
                    Выбрано: <span id="selectedDate">—</span>
                </div>
            </div>

            <div class="panel">
                <h2>Заметки</h2>
                <textarea id="noteInput" placeholder="Текст заметки..."></textarea>
                <button id="addNoteBtn">Добавить</button>
                <ul id="notesList"></ul>
                <div class="empty-msg" id="notesEmpty">Нет заметок</div>
            </div>
        </div>
    </div>

    <script>
        let todos = [
            { id: 1, text: 'Изучить JS', done: false },
            { id: 2, text: 'Сделать проект', done: true }
        ];

        let notes = [
            { id: 1, text: 'Не забыть про дедлайн', date: new Date() }
        ];

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selected = null;

        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        const todoList = document.getElementById('todoList');
        const todoEmpty = document.getElementById('todoEmpty');
        const todoInput = document.getElementById('todoInput');
        const addTodoBtn = document.getElementById('addTodoBtn');

        const calGrid = document.getElementById('calGrid');
        const monthYear = document.getElementById('monthYear');
        const selectedDate = document.getElementById('selectedDate');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');

        const notesList = document.getElementById('notesList');
        const notesEmpty = document.getElementById('notesEmpty');
        const noteInput = document.getElementById('noteInput');
        const addNoteBtn = document.getElementById('addNoteBtn');

        function renderTodos() {
            todoList.innerHTML = '';
            if (todos.length === 0) {
                todoEmpty.style.display = 'block';
                return;
            }
            todoEmpty.style.display = 'none';

            todos.forEach(todo => {
                const li = document.createElement('li');
                if (todo.done) li.classList.add('done');

                const span = document.createElement('span');
                span.textContent = todo.text;
                span.dataset.id = todo.id;

                const delBtn = document.createElement('button');
                delBtn.className = 'mini-btn';
                delBtn.textContent = 'Удалить';
                delBtn.dataset.del = todo.id;

                li.appendChild(span);
                li.appendChild(delBtn);
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;
            todos.push({ id: Date.now(), text: text, done: false });
            todoInput.value = '';
            renderTodos();
        }

        addTodoBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') addTodo();
        });

        todoList.addEventListener('click', e => {
            if (e.target.dataset.del) {
                todos = todos.filter(t => t.id != e.target.dataset.del);
                renderTodos();
            } else if (e.target.tagName === 'SPAN' && e.target.dataset.id) {
                const todo = todos.find(t => t.id == e.target.dataset.id);
                if (todo) todo.done = !todo.done;
                renderTodos();
            }
        });

        function renderCalendar() {
            monthYear.textContent = months[currentMonth] + ' ' + currentYear;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;
            const daysCount = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();

            calGrid.innerHTML = '';

            weekdays.forEach(w => {
                const d = document.createElement('div');
                d.className = 'weekday';
                d.textContent = w;
                calGrid.appendChild(d);
            });

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day empty';
                calGrid.appendChild(empty);
            }

            for (let d = 1; d <= daysCount; d++) {
                const day = document.createElement('div');
                day.className = 'day';
                day.textContent = d;
                day.dataset.day = d;

                if (d === today.getDate() &&
                    currentMonth === today.getMonth() &&
                    currentYear === today.getFullYear()) {
                    day.classList.add('today');
                }

                if (selected &&
                    selected.day === d &&
                    selected.month === currentMonth &&
                    selected.year === currentYear) {
                    day.classList.add('selected');
                }

                calGrid.appendChild(day);
            }
        }

        calGrid.addEventListener('click', e => {
            if (!e.target.dataset.day) return;
            const d = Number(e.target.dataset.day);
            selected = { day: d, month: currentMonth, year: currentYear };
            const date = new Date(currentYear, currentMonth, d);
            selectedDate.textContent = date.toLocaleDateString('ru-RU');
            renderCalendar();
        });

        prevMonthBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        function renderNotes() {
            notesList.innerHTML = '';
            if (notes.length === 0) {
                notesEmpty.style.display = 'block';
                return;
            }
            notesEmpty.style.display = 'none';

            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = 'note-item';

                const p = document.createElement('p');
                p.textContent = note.text;

                const foot = document.createElement('div');
                foot.className = 'note-foot';

                const dateSpan = document.createElement('span');
                dateSpan.className = 'note-date';
                dateSpan.textContent = note.date.toLocaleString('ru-RU');

                const delBtn = document.createElement('button');
                delBtn.className = 'mini-btn';
                delBtn.textContent = 'Удалить';
                delBtn.dataset.del = note.id;

                foot.appendChild(dateSpan);
                foot.appendChild(delBtn);
                li.appendChild(p);
                li.appendChild(foot);
                notesList.appendChild(li);
            });
        }

        function addNote() {
            const text = noteInput.value.trim();
            if (!text) return;
            notes.push({ id: Date.now(), text: text, date: new Date() });
            noteInput.value = '';
            renderNotes();
        }

        addNoteBtn.addEventListener('click', addNote);

        notesList.addEventListener('click', e => {
            if (e.target.dataset.del) {
                notes = notes.filter(n => n.id != e.target.dataset.del);
                renderNotes();
            }
        });

        renderTodos();
        renderCalendar();
        renderNotes();
    </script>
</body>
</html>
